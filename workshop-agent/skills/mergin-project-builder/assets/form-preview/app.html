<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Preview</title>
<!--
  Mergin Maps form preview, generated by the Mergin Maps project builder
  (scripts/form_preview.py). Colors, sizes, fonts and icons follow the
  Mergin Maps mobile app (github.com/MerginMaps/mobile, app/mmstyle.h and
  app/qml/form, icons GPL-2.0). It is a preview: nothing is saved anywhere.
-->
<style>
@font-face { font-family: "MMInter"; src: url(data:font/woff2;base64,{{FONT}}) format("woff2"); font-weight: 100 900; }
:root {
  /* app/mmstyle.h */
  --grass: #73D19C; --forest: #004C45; --night: #12181F; --polar: #FFFFFF;
  --light-green: #EFF5F3; --medium-green: #B7CDC4; --dark-green: #6E9991;
  --grey: #E2E2E2; --dark-grey: #41464C; --medium-grey: #A0A3A5;
  --sand: #FFF4E2; --earth: #4D2A24; --grape: #5A2740;
  --warning: #F7DDAF; --negative: #F0C4BC; --negative-light: #FFF0ED; --negative-ultra: #FEFAF9;
  --positive: #C0EBCF;
  /* page around the phone */
  --page: #dde7e3; --page-text: #273b36; --page-muted: #5b6e68;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0f1a17; --page-text: #e3ece8; --page-muted: #9fb2ab; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--page-text);
  font-family: "MMInter", Inter, -apple-system, system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 48px; padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, textarea { font: inherit; }

/* ---------- side panel (outside the phone) ---------- */
.side { max-width: 320px; }
.side h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; font-weight: 650; }
.side .sub { color: var(--page-muted); font-size: 14px; margin: 0 0 22px; }
.side .note { font-size: 13px; color: var(--page-muted); line-height: 1.5; margin: 0 0 14px; }
.side .note b { color: var(--page-text); font-weight: 600; }
.side .reset { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--page-text);
  border: 1px solid currentColor; border-radius: 30px; padding: 8px 16px; opacity: .8; }
.side .reset:hover { opacity: 1; }

/* ---------- phone ---------- */
.phone { width: 390px; height: 844px; max-height: calc(100vh - 48px); border-radius: 54px; background: var(--night);
  padding: 12px; box-shadow: 0 30px 80px rgba(0, 40, 30, .25); flex: none; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden;
  background: var(--light-green); color: var(--night); display: flex; flex-direction: column; }
.status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px; font-size: 15px; font-weight: 600; color: var(--night); }
.status .dots { display: flex; gap: 5px; align-items: center; }
.status .dots i { display: block; width: 17px; height: 11px; border-radius: 3px; border: 1.5px solid var(--night); }
@media (max-width: 760px) {
  body { padding: 0; display: block; }
  .side { display: none; }
  .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
  .status { display: none; }
}

.icon { display: inline-flex; width: 24px; height: 24px; flex: none; }
.icon svg { width: 100%; height: 100%; }
.i16 { width: 16px; height: 16px; } .i32 { width: 32px; height: 32px; } .i40 { width: 40px; height: 40px; }

/* MMPageHeader: 60px, t3 title, 40px round buttons at the page margins */
.header { height: 60px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 80px; }
.header .title { font-size: 14px; font-weight: 600; color: var(--forest); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.round { width: 40px; height: 40px; border-radius: 20px; background: var(--polar); color: var(--forest);
  display: inline-flex; align-items: center; justify-content: center; position: absolute; top: 10px; transition: background .15s; }
.round:hover { background: var(--medium-green); }
.round.left { left: 20px; } .round.right { right: 20px; }
.round.save { background: var(--grass); color: var(--forest); }
.round.save.bad { background: var(--negative); color: var(--grape); }

/* MMFormTabBar: 45px pills, t4, selected = grass */
.tabs { flex: none; display: flex; gap: 0; overflow-x: auto; padding: 0 20px; margin: 10px 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 45px; padding: 0 20px; border-radius: 30px; font-size: 12px; font-weight: 600; color: var(--night); white-space: nowrap; flex: none; }
.tab.on { background: var(--grass); }

.body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 20px 20px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.form { display: flex; flex-direction: column; gap: 20px; }
.group { font-size: 24px; font-weight: 600; color: var(--forest); line-height: 1.25; padding-top: 10px; }

/* MMBaseInput */
.field { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 12px; color: var(--night); line-height: 1.35; }
.box { height: 50px; background: var(--polar); border-radius: 12px; border: 0 solid var(--polar);
  display: flex; align-items: center; gap: 12px; padding: 0 20px; cursor: text; transition: border-color .12s; }
.box:hover { border-width: 1px; border-color: var(--forest); }
.box.focus { border-width: 2px; border-color: var(--forest); }
.box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--night); font-size: 14px; padding: 0; }
.box input::placeholder, textarea::placeholder { color: var(--dark-grey); }
.box .value { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box .value:empty::before { content: attr(data-ph); color: var(--dark-grey); }
.box .icon { color: var(--forest); }
.box.click { cursor: pointer; }
.box.num input { text-align: center; }
.box.num .icon { cursor: pointer; }
.box.num .icon.off { color: var(--medium-grey); cursor: default; }
textarea.box { height: auto; min-height: 100px; padding: 15px 20px; resize: none; width: 100%; display: block;
  font-size: 14px; color: var(--night); outline: 0; line-height: 1.4; }
.field.error .box { border-width: 2px; border-color: var(--negative); background: var(--negative-ultra); }
.field.warning .box { border-width: 2px; border-color: var(--warning); background: var(--negative-ultra); }
.field.error .box .icon:not(.off) { color: var(--grape); }
.field.warning .box .icon:not(.off) { color: var(--earth); }
.msg { display: none; align-items: flex-start; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1.35; }
.field.error .msg, .field.warning .msg { display: flex; }
.msg .icon { color: var(--negative); margin-top: 0; }
.field.error .msg { color: var(--grape); }
.field.warning .msg { color: var(--earth); } .field.warning .msg .icon { color: var(--warning); }
.readonly .box, .readonly .box:hover { border-width: 0; cursor: default; background: var(--polar); }
.readonly .box .icon { color: var(--medium-grey); }

/* MMSwitch: 48x28, handle 20 */
.switch { width: 48px; height: 28px; border-radius: 14px; background: var(--light-green); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 7px; width: 20px; height: 20px; border-radius: 10px; background: var(--forest); transition: left .15s; }
.switch.on { background: var(--grass); }
.switch.on::after { left: 21px; }
.field.error .switch:not(.on) { background: var(--negative-light); }
.field.warning .switch:not(.on) { background: var(--sand); }

/* MMPhotoAttachment / photo preview */
.photo { height: 160px; background: var(--polar); border-radius: 20px; padding: 20px; display: flex; gap: 20px; }
.photo .pick { flex: 1; background: var(--light-green); border-radius: 20px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--night); }
.photo .pick .icon { color: var(--forest); }
.photo .pick:hover { background: #e3eeea; }
.shot { height: 160px; border-radius: 20px; overflow: hidden; position: relative; background: var(--polar); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .round { top: 10px; right: 10px; }
.field.error .photo { box-shadow: inset 0 0 0 2px var(--negative); }
.gallery { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
.gallery .add, .gallery .item { width: 120px; height: 120px; border-radius: 20px; flex: none; position: relative; overflow: hidden; }
.gallery .add { background: var(--polar); display: flex; align-items: center; justify-content: center; color: var(--forest); }
.gallery .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .item .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 14px; background: var(--polar); color: var(--forest); display: flex; align-items: center; justify-content: center; }
.gallery .item .x .icon { width: 18px; height: 18px; }

/* MMToolbar: forest, white icons + t4 labels */
.toolbar { flex: none; background: var(--forest); color: var(--polar); display: flex; justify-content: space-around; height: 76px; padding-bottom: 8px; }
.toolbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--polar); }
.toolbar button .icon { color: var(--polar); }

/* Layer chooser */
.list { background: var(--polar); border-radius: 20px; padding: 0 20px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 20px 0; border-bottom: 1px solid var(--grey); }
.row:last-child { border-bottom: 0; }
.row .txt { flex: 1; min-width: 0; }
.row .t { font-size: 14px; font-weight: 600; color: var(--night); }
.row .s { font-size: 12px; color: var(--night); margin-top: 4px; opacity: .8; }
.row .dot { width: 14px; height: 14px; border-radius: 7px; flex: none; }
.row .dot.line { height: 5px; border-radius: 3px; width: 18px; }
.row .dot.polygon { border-radius: 3px; }
.row .dot.none { background: transparent !important; border: 2px solid var(--dark-green); border-radius: 3px; }
.hint { font-size: 12px; color: var(--dark-green); text-align: center; margin: 18px 10px 0; line-height: 1.5; }

/* MMDrawer: white sheet, radius 20, 60px header, close = light-green round button */
.dim { position: absolute; inset: 0; background: rgba(18, 24, 31, .45); opacity: 0; transition: opacity .2s; z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--polar); border-radius: 20px 20px 0 0;
  max-height: 82%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); z-index: 6; }
.open .dim { opacity: 1; } .open .sheet { transform: none; }
.sheet .header { padding: 0 80px; }
.sheet .round.right { background: var(--light-green); }
.sheet .scroll { overflow-y: auto; padding: 0 20px 20px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 20px 0; border-bottom: 1px solid var(--grey); font-size: 14px; font-weight: 600; color: var(--night); }
.opt:last-child { border-bottom: 0; }
.opt span { flex: 1; }
.opt .icon { color: var(--forest); }
.cb { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--forest); flex: none; display: flex; align-items: center; justify-content: center; color: var(--forest); }
.cb.on { background: var(--grass); border-color: var(--grass); }
.cb .icon { width: 20px; height: 20px; }
.search { margin: 0 20px 10px; height: 50px; background: var(--light-green); border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 20px; flex: none; }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--night); }
.search .icon { color: var(--forest); }
.empty { padding: 30px 0; text-align: center; font-size: 14px; color: var(--dark-grey); }
.primary { display: block; margin: 10px 20px 24px; height: 50px; border-radius: 30px; background: var(--grass); color: var(--forest); font-size: 14px; font-weight: 600; flex: none; }
.primary:hover { background: #63c18c; }

/* calendar */
.cal { padding: 0 20px; }
.cal .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal .top b { font-size: 16px; font-weight: 600; color: var(--forest); }
.cal .top button { width: 40px; height: 40px; border-radius: 20px; background: var(--light-green); color: var(--forest); display: flex; align-items: center; justify-content: center; }
.cal .top button.next .icon { transform: rotate(180deg); }
.cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--dark-green); padding: 6px 0; }
.cal .d { height: 40px; border-radius: 20px; font-size: 14px; color: var(--night); }
.cal .d:hover { background: var(--light-green); }
.cal .d.today { box-shadow: inset 0 0 0 1px var(--forest); }
.cal .d.on { background: var(--grass); color: var(--forest); font-weight: 600; }
.cal .time { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 14px; }
.cal .time input { height: 44px; border-radius: 12px; border: 0; background: var(--light-green); padding: 0 14px; font-size: 14px; color: var(--night); }

/* MMNotification-like toast */
.toast { position: absolute; left: 20px; right: 20px; top: 54px; z-index: 9; background: var(--positive); color: var(--forest);
  border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 600; display: flex; gap: 10px; align-items: center;
  transform: translateY(-140%); opacity: 0; transition: transform .25s, opacity .25s; }
.toast.bad { background: var(--negative); color: var(--grape); }
.toast.show { transform: none; opacity: 1; }
@media (max-width: 760px) { .toast { top: 12px; } }
</style>
</head>
<body>
<aside class="side">
  <h1 id="ptitle"></h1>
  <p class="sub" id="psub"></p>
  <p class="note">This is how the forms look in the <b>Mergin Maps app</b>. Tap a layer, fill in the form, try the rules, then save.</p>
  <p class="note" id="phidden"></p>
  <p class="note">Nothing leaves this page. Photos stay in your browser.</p>
  <button class="reset" id="reset">Start over</button>
</aside>
<div class="phone"><div class="screen" id="screen">
  <div class="status"><span>9:41</span><span class="dots"><i></i></span></div>
  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div class="toast" id="toast"></div>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"></div>
</div></div>

<script>
const SPEC = {{SPEC}};
const ICONS = {{ICONS}};
const TODAY = new Date();

// ---------- tiny DOM helper: strings always become text, never HTML ----------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
  return n;
}
function icon(name, cls) {  // icons come from the app's own SVGs (trusted, embedded at build time)
  const span = el("span", { class: "icon" + (cls ? " " + cls : "") });
  span.innerHTML = ICONS[name] || "";
  return span;
}

// ---------- spec helpers ----------
const LISTS = SPEC.lookup_lists || {};
const visibleFields = (layer) => (layer.fields || []).filter(f => (f.widget || "text") !== "hidden");
const labelOf = (f) => f.alias || f.name;
const GEOM = { point: "Point layer", line: "Line layer", polygon: "Polygon layer", none: "Table (no map)" };

// Tabs and groups, the same rule as form_layout() in build_project.py.
function layout(layer) {
  const items = visibleFields(layer);
  const tabs = []; const byTab = {};
  for (const f of items) {
    const t = f.tab || "";
    if (!(t in byTab)) { byTab[t] = []; tabs.push(t); }
    byTab[t].push(f);
  }
  return tabs.map((t, i) => {
    const rows = []; const groups = {};
    for (const f of byTab[t]) {
      if (!f.group) { rows.push({ field: f }); continue; }
      if (!groups[f.group]) { groups[f.group] = { group: f.group, fields: [] }; rows.push(groups[f.group]); }
      groups[f.group].fields.push(f);
    }
    if (layer.multiple_photos && i === 0) rows.push({ gallery: true });
    return { name: t, rows };
  });
}

// ---------- QGIS expression subset (constraints + defaults) ----------
// Enough for the rules the builder writes. Anything it can't read is "not
// checked in the preview" rather than a wrong error.
class Unsupported extends Error {}
function tokenize(s) {
  const out = []; let i = 0;
  const re = /\s+|(\d+(?:\.\d+)?)|'((?:[^']|'')*)'|"((?:[^"]|"")*)"|(@[A-Za-z_][A-Za-z0-9_]*)|(\$[A-Za-z_]+)|([A-Za-z_][A-Za-z0-9_]*)|(<=|>=|<>|!=|\|\||[=<>+\-*/%(),~])/y;
  while (i < s.length) {
    re.lastIndex = i; const m = re.exec(s);
    if (!m) throw new Unsupported("token");
    i = re.lastIndex;
    if (m[1]) out.push({ t: "num", v: parseFloat(m[1]) });
    else if (m[2] !== undefined) out.push({ t: "str", v: m[2].replace(/''/g, "'") });
    else if (m[3] !== undefined) out.push({ t: "fld", v: m[3].replace(/""/g, '"') });
    else if (m[4]) out.push({ t: "var", v: m[4].slice(1) });
    else if (m[5]) out.push({ t: "geo", v: m[5] });
    else if (m[6]) out.push({ t: "id", v: m[6], u: m[6].toUpperCase() });
    else if (m[7]) out.push({ t: "op", v: m[7] });
  }
  return out;
}
function parse(src) {
  const tk = tokenize(src); let p = 0;
  const peek = () => tk[p]; const kw = (w) => tk[p] && tk[p].t === "id" && tk[p].u === w;
  const op = (o) => tk[p] && tk[p].t === "op" && tk[p].v === o;
  const expect = (o) => { if (!op(o)) throw new Unsupported("expect " + o); p++; };
  function orE() { let l = andE(); while (kw("OR")) { p++; const r = andE(); l = { k: "or", l, r }; } return l; }
  function andE() { let l = notE(); while (kw("AND")) { p++; const r = notE(); l = { k: "and", l, r }; } return l; }
  function notE() { if (kw("NOT")) { p++; return { k: "not", e: notE() }; } return cmp(); }
  function cmp() {
    let l = add();
    for (;;) {
      if (kw("IS")) { p++; let neg = false; if (kw("NOT")) { p++; neg = true; } const r = add(); l = { k: "is", l, r, neg }; continue; }
      let neg = false;
      if (kw("NOT") && tk[p + 1] && tk[p + 1].t === "id" && ["IN", "LIKE", "ILIKE"].includes(tk[p + 1].u)) { p++; neg = true; }
      if (kw("IN")) { p++; expect("("); const list = [add()]; while (op(",")) { p++; list.push(add()); } expect(")"); l = { k: "in", l, list, neg }; continue; }
      if (kw("LIKE") || kw("ILIKE")) { const ci = peek().u === "ILIKE"; p++; l = { k: "like", l, r: add(), ci, neg }; continue; }
      const t = peek();
      if (t && t.t === "op" && ["=", "<>", "!=", "<", "<=", ">", ">=", "~"].includes(t.v)) { p++; l = { k: "cmp", o: t.v, l, r: add() }; continue; }
      return l;
    }
  }
  function add() { let l = mul(); while (op("+") || op("-") || op("||")) { const o = tk[p++].v; l = { k: "bin", o, l, r: mul() }; } return l; }
  function mul() { let l = un(); while (op("*") || op("/") || op("%")) { const o = tk[p++].v; l = { k: "bin", o, l, r: un() }; } return l; }
  function un() { if (op("-")) { p++; return { k: "neg", e: un() }; } return prim(); }
  function prim() {
    const t = tk[p++];
    if (!t) throw new Unsupported("end");
    if (t.t === "num" || t.t === "str") return { k: "lit", v: t.v };
    if (t.t === "fld") return { k: "fld", v: t.v };
    if (t.t === "var") return { k: "var", v: t.v };
    if (t.t === "geo") return { k: "geo" };
    if (t.t === "op" && t.v === "(") { const e = orE(); expect(")"); return e; }
    if (t.t === "id") {
      if (t.u === "NULL") return { k: "lit", v: null };
      if (t.u === "TRUE") return { k: "lit", v: true };
      if (t.u === "FALSE") return { k: "lit", v: false };
      if (t.u === "CASE") {
        const whens = []; let other = { k: "lit", v: null };
        while (kw("WHEN")) { p++; const c = orE(); if (!kw("THEN")) throw new Unsupported("case"); p++; whens.push([c, orE()]); }
        if (kw("ELSE")) { p++; other = orE(); }
        if (!kw("END")) throw new Unsupported("case"); p++;
        return { k: "case", whens, other };
      }
      if (op("(")) {
        p++; const args = [];
        if (!op(")")) { args.push(orE()); while (op(",")) { p++; args.push(orE()); } }
        expect(")"); return { k: "fn", n: t.v.toLowerCase(), args };
      }
      return { k: "fld", v: t.v };  // bare field name
    }
    throw new Unsupported("unexpected");
  }
  const ast = orE();
  if (p !== tk.length) throw new Unsupported("trailing");
  return ast;
}
const pad = (n) => String(n).padStart(2, "0");
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isoDateTime = (d) => `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    const lead = (month.getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) grid.append(el("span", {}));
    const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const day = new Date(month.getFullYear(), month.getMonth(), d);
      const cls = "d" + (isoDate(day) === isoDate(TODAY) ? " today" : "") + (sel && isoDate(day) === isoDate(sel) ? " on" : "");
      grid.append(el("button", { class: cls, onclick: () => { sel = day; draw(); } }, d));
    }
    cal.replaceChildren(...[el("div", { class: "top" }, prev, el("b", {}, name), next), grid,
      time ? el("div", { class: "time" }, "Time", time) : null].filter(Boolean));
  };
  draw();
  openSheet(title, cal, el("button", { class: "primary", onclick: () => {
    const day = sel || TODAY;
    done(withTime ? `${isoDate(day)} ${time.value.length === 5 ? time.value + ":00" : time.value}` : isoDate(day));
    closeSheet();
  } }, "Select"));
}

// ---------- actions ----------
let toastTimer;
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.replaceChildren(icon(bad ? "ErrorCircle" : "DoneCircle"), el("span", {}, text));
  t.classList.toggle("bad", !!bad); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function save() {
  const errs = problems().filter(([, p]) => p.level === "error");
  if (errs.length) {
    toast("Feature could not be saved, please check all required fields", true);
    // jump to the first tab with a problem
    const tabs = layout(state.layer);
    const i = tabs.findIndex(t => t.rows.some(r => (r.field && r.field === errs[0][0]) || (r.fields && r.fields.includes(errs[0][0]))));
    if (i >= 0 && i !== state.tab) { state.tab = i; render(); }
    return;
  }
  (state.saved[state.layer.name] = state.saved[state.layer.name] || []).push({ ...state.values });
  state.readOnly = true; render(); toast("Feature saved");
}
function back(skip) {
  closeSheet(); state.screen = "layers"; state.layer = null; render();
}

// ---------- side panel ----------
document.getElementById("ptitle").textContent = SPEC.title || SPEC.project_name;
document.getElementById("psub").textContent = [SPEC.project_name, SPEC.area_of_interest && SPEC.area_of_interest.label].filter(Boolean).join(" · ");
document.getElementById("phidden").textContent = "Hidden, filled in by the app: unique ID, who and when created / updated, GPS accuracy (points), spare fields.";
document.getElementById("reset").addEventListener("click", () => { closeSheet(); state = freshState(); render(); });

state = freshState();
if ((SPEC.layers || []).length === 1) newFeature(SPEC.layers[0]); else render();
</script>
